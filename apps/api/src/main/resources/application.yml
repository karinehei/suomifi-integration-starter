spring:
  application:
    name: suomifi-integration-api
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:suomifi_db}
    username: ${DB_USER:suomifi_user}
    password: ${DB_PASSWORD:suomifi_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    fi.demo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Suomi.fi client configuration
suomifi:
  client:
    base-url: ${SUOMIFI_BASE_URL:http://wiremock:8080}  # Docker internal port; use localhost:8089 for local dev
    client-id: ${SUOMIFI_CLIENT_ID:demo-client-id}
    client-secret: ${SUOMIFI_CLIENT_SECRET:demo-client-secret}
    redirect-uri: ${SUOMIFI_REDIRECT_URI:http://localhost:8080/api/v1/auth/callback}
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    retry-enabled: true
    max-retry-attempts: 3
    retry-initial-delay-ms: 500
    # Certificate path fields are unused. SuomifiClientConfiguration.buildSslContext
    # returns null and does not install a client certificate. See the README.
    # client-certificate-path: classpath:certificates/client.pem
    # client-key-path: classpath:certificates/client-key.pem
    # truststore-path: classpath:certificates/truststore.jks
    # truststore-password: ${TRUSTSTORE_PASSWORD:changeit}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
