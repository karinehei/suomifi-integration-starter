version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: suomifi-postgres
    environment:
      POSTGRES_DB: suomifi_db
      POSTGRES_USER: suomifi_user
      POSTGRES_PASSWORD: suomifi_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suomifi_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  wiremock:
    image: wiremock/wiremock:latest
    container_name: suomifi-wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/__admin"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: suomifi-api
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: suomifi_db
      DB_USER: suomifi_user
      DB_PASSWORD: suomifi_pass
      SUOMIFI_BASE_URL: http://wiremock:8080  # Internal Docker port (8080), external is 8089
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
